name: Refresh viikkopelit

on:
  schedule:
    # Mon-Wed 15:00, 17:00, 19:00 EEST (= 12, 14, 16 UTC)
    - cron: '0 12,14,16 * * 1-3'
    # Thu 12:00 EEST (= 09 UTC)
    - cron: '0 9 * * 4'
  workflow_dispatch: # manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger refresh (retry until machine wakes)
        run: |
          URL="https://ols-viikkopelit.fly.dev/api/refresh"
          for i in 1 2 3; do
            echo "Attempt $i..."
            RESPONSE=$(curl -s -w '\n%{http_code}' --max-time 30 -X POST "$URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -1)
            echo "HTTP $HTTP_CODE: $BODY"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Refresh OK"
              exit 0
            fi
            echo "Retrying in 15s..."
            sleep 15
          done
          echo "❌ All attempts failed"
          exit 1
